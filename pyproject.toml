[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mathjson-solver"
version = "2.3.0"
authors = [{name = "Martins Mednis", email = "mrt@mednis.info"}]
description = "Utilities for MathJSON evaluation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
# TrapezoidalIntegrate is the only construct that needs numpy; every
# other construct works with no optional dependencies installed at all.
integration = ["numpy"]
# RegExp/IsMatch/StringMatch/StringMatchAll use RE2 rather than Python's
# `re`: RE2 guarantees linear-time matching (no catastrophic
# backtracking possible, by construction), at the cost of not
# supporting backreferences or lookaround - a deliberate trade-off for a
# solver that evaluates untrusted expressions with no execution budget
# of its own. Optional, same as `integration` above.
regex = ["google-re2"]

[project.urls]
Homepage = "https://github.com/LongenesisLtd/mathjson-solver"
"Bug Tracker" = "https://github.com/LongenesisLtd/mathjson-solver/issues"

[tool.hatch.build.targets.sdist]
# Explicit allowlist: hatchling's default sdist selection includes any file
# not gitignored, tracked or not, which previously leaked the (gitignored-
# but-not-excluded) untracked/ scratch directory and local Claude Code
# settings into the published package.
include = [
    "/src",
    "/tests",
    "/docs",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/CONTRIBUTING.md",
    "/CODE_OF_CONDUCT.md",
    "/SECURITY.md",
    "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mathjson_solver"]
